command: ["python", "arranque.py"]

env:
  # La carpeta del Volume con el paquete precalculado. El catalogo y el esquema se
  # RESUELVEN en cada despliegue (contrato C): `workspace.default` no existe en todos
  # los workspaces, y el de CHEC es uno de los que no lo tiene (D1).
  # `/subir-a-databricks` sustituye este valor por el que resolvio antes de subir.
  #
  # Estuvo SIN declarar, y ese era el defecto: `arranque.py` la lee, no la encontraba,
  # y caia a su valor por defecto -- el Volume de un catalogo que aqui no existe. La
  # app arrancaba y no encontraba su paquete.
  - name: VOLUME_06
    value: "/Volumes/workspace/default/chec-simulador/paquete_06"
  # Donde se deja la copia local dentro del contenedor. No se sustituye: es una ruta
  # del contenedor, no del workspace.
  - name: PAQUETE_06
    value: "/tmp/paquete_06"
  # La carpeta del Volume donde el tablero escribe lo que se guarda con el boton
  # "Guardar": el informe HTML de cada corrida y el registro con el que "Cargar"
  # vuelve a ella. `/subir-a-databricks` la sustituye por el destino resuelto, igual
  # que `VOLUME_06`.
  #
  # Hermana de `paquete_06` y no hija suya: volver a subir el paquete no puede
  # llevarse por delante el trabajo guardado por la gente.
  #
  # Es el Volume y NO el disco del contenedor porque ese disco es efimero y ademas el
  # usuario no puede alcanzarlo. Que este puesta es lo que hace que el tablero elija
  # el almacen del Volume; en local no existe y escribe en el disco del usuario.
  - name: SIMULACIONES_VOLUMEN
    value: "/Volumes/workspace/default/chec-simulador/simulaciones"
